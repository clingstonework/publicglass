name: Fetch Government Data

on:
  schedule:
    # Run daily at 2pm UTC = midnight AEST (approx)
    - cron: '0 14 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch AusTender data
        run: python scripts/fetch_austender.py

      - name: Commit and push if data changed
        run: |
          git config user.name "Public Glass Bot"
          git config user.email "bot@publicglass.net"
          git add src/_data/
          git diff --staged --quiet || git commit -m "chore: update government data"
          git push
